[project]
name = "canada-tracker"
version = "0.1.0"
description = "Personal desktop tracker for the Canada project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canada_tracker*"]
